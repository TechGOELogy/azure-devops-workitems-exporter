name: Build & Publish

on:
  push:
    branches:
      - main
      - code-maintenance
  pull_request:
    branches:
      - main

env:
  DOTNET_VERSIONS: "net10.0"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore azure-devops-workitems-exporter.slnx

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu' # Alternative distribution options are available.

      - name: Cache SonarQube Cloud packages
        uses: actions/cache@v4
        with:
          path: ~\sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarQube Cloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarQube Cloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        run: |
          mkdir /tmp/scanner
          dotnet tool update dotnet-sonarscanner --tool-path /tmp/scanner

      - name: Prepare SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          /tmp/scanner/dotnet-sonarscanner begin /k:"TechGOELogy_azure-devops-workitems-exporter" \
          /o:"techgoelogy" /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
          /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" \
          /d:sonar.sources=src \
          /d:sonar.coverage.inclusions=src

      - name: Build
        run: dotnet build azure-devops-workitems-exporter.slnx --configuration Release --no-restore

      - name: Run unit tests & collect coverage
        run: |
          dotnet test ./tests/AzureDevOpsWorkItemExporter.Tests/AzureDevOpsWorkitemsExporter.Tests.csproj \
            --configuration Release \
            --no-build \
            --collect:"XPlat Code Coverage;Format=cobertura,opencover"

      - name: Publish SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          /tmp/scanner/dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
      
      - name: Publish Cobertura Report
        uses: 5monkeys/cobertura-action@v14
        with:
          path: "**/coverage.cobertura.xml"
          minimum_coverage: 10

      - name: Publish Linux executable
        working-directory: ./src/AzureDevOpsWorkItemExporter
        run: |
          mkdir -p ${{ github.workspace }}/artifacts/linux
          dotnet publish AzureDevOpsWorkitemsExporter.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained true \
            /p:PublishSingleFile=true \
            --output ${{ github.workspace }}/artifacts/linux

      - name: Publish Windows executable
        working-directory: ./src/AzureDevOpsWorkItemExporter
        run: |
          mkdir -p ${{ github.workspace }}/artifacts/windows
          dotnet publish AzureDevOpsWorkitemsExporter.csproj \
            --configuration Release \
            --runtime win-x64 \
            --self-contained true \
            /p:PublishSingleFile=true \
            --output ${{ github.workspace }}/artifacts/windows

      - name: Upload linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: azure-devops-workitems-exporter-linux
          path: artifacts/linux

      - name: Upload windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: azure-devops-workitems-exporter-win
          path: artifacts/windows
