name: Build & Publish

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  DOTNET_VERSIONS: "net10.0"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore azure-devops-workitems-exporter.slnx

      - name: Build
        run: dotnet build azure-devops-workitems-exporter.slnx --configuration Release --no-restore

      - name: Run unit tests & collect coverage
        run: dotnet test tests/AzureDevOpsWorkItemExporter.Tests/AzureDevOpsWorkitemsExporter.Tests.csproj \
          --configuration Release \
          --no-build \
          -p:CollectCoverage=true \
          -p:CoverletOutputFormat=cobertura \
          -p:CoverletOutput=$(System.DefaultWorkingDirectory)/coverage/coverage.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/coverage.xml

      - name: Publish Linux executable
        run: dotnet publish src/AzureDevOpsWorkItemExporter/AzureDevOpsWorkitemsExporter.csproj \
          --configuration Release \
          --runtime linux-x64 \
          --self-contained true \
          /p:PublishSingleFile=true \
          --output ./artifacts/linux

      - name: Publish Windows executable
        run: dotnet publish src/AzureDevOpsWorkItemExporter/AzureDevOpsWorkitemsExporter.csproj \
          --configuration Release \
          --runtime win-x64 \
          --self-contained true \
          /p:PublishSingleFile=true \
          --output ./artifacts/windows

      - name: Upload linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: azure-devops-workitems-exporter-linux
          path: artifacts/linux

      - name: Upload windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: azure-devops-workitems-exporter-win
          path: artifacts/windows
