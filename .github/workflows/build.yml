name: Build & Publish

on:
  push:
    branches:
      - main
      - feature/pipeline
  pull_request:
    branches:
      - main

env:
  DOTNET_VERSIONS: "net10.0"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore azure-devops-workitems-exporter.slnx

      - name: Build
        run: dotnet build azure-devops-workitems-exporter.slnx --configuration Release --no-restore

      - name: Run unit tests & collect coverage
        env:
          COVERAGE_PATH: ${{ github.workspace }}/coverage/coverage.xml
        run: |
          mkdir -p coverage
          mkdir -p "$(dirname "$COVERAGE_PATH")"
          dotnet test ./tests/AzureDevOpsWorkItemExporter.Tests/AzureDevOpsWorkitemsExporter.Tests.csproj \
            --configuration Release \
            --no-build \
            -p:CollectCoverage=true \
            -p:CoverletOutputFormat=cobertura \
            -p:CoverletOutput=$COVERAGE_PATH
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/coverage.xml

      - name: Publish Linux executable
        working-directory: ./src/AzureDevOpsWorkItemExporter
        run: |
          mkdir -p ${{ github.workspace }}/artifacts/linux
          dotnet publish AzureDevOpsWorkitemsExporter.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained true \
            /p:PublishSingleFile=true \
            --output ${{ github.workspace }}/artifacts/linux

      - name: Publish Windows executable
        working-directory: ./src/AzureDevOpsWorkItemExporter
        run: |
          mkdir -p ${{ github.workspace }}/artifacts/windows
          dotnet publish AzureDevOpsWorkitemsExporter.csproj \
            --configuration Release \
            --runtime win-x64 \
            --self-contained true \
            /p:PublishSingleFile=true \
            --output ${{ github.workspace }}/artifacts/windows

      - name: Upload linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: azure-devops-workitems-exporter-linux
          path: artifacts/linux

      - name: Upload windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: azure-devops-workitems-exporter-win
          path: artifacts/windows

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          user_name: GitHub Actions
          user_email: actions@github.com
